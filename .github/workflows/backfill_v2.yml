name: GEFS backfill v2
on:
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

concurrency:
  group: backfill-v2
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 16   # 11→16 (2026-07-30 사용자 지시): m4 전용 레인 5개 추가분 (계정 동시잡 20 제한 → watchdog용 4슬롯 여유)   # 10→11 (2026-07-29): m4 전용 레인(s11b)   # 5→10 (2026-07-28): 병렬5는 ~800단위/h로 느림
      matrix:
        include:
          - {member: 0, seg: "s11", start: "2017-01-01", end: "2020-08-31", stagger: 0}
          - {member: 1, seg: "s11", start: "2017-01-01", end: "2020-08-31", stagger: 2}
          - {member: 2, seg: "s11", start: "2017-01-01", end: "2020-08-31", stagger: 4}
          - {member: 3, seg: "s11", start: "2017-01-01", end: "2020-08-31", stagger: 6}
          - {member: 4, seg: "s11", start: "2017-01-01", end: "2020-08-31", stagger: 8}
          # m4 전용 추가 레인 (2026-07-29): m4가 s11에서 크게 뒤처짐(2018-01까지).
          # 같은 세그먼트를 뒤쪽 구간부터 파서 앞뒤로 좁힌다 — 이미 받은 (cycle,lead)는 자동 스킵되므로 중복 없음.
          # seg 태그를 s11b 로 분리해 fails 파일 충돌 방지.
          - {member: 4, seg: "s11b", start: "2019-01-01", end: "2020-08-31", stagger: 40}
          # ── m4 전용 추가 5레인 (2026-07-30 사용자 지시: "m4에 병렬레인 5마리 더") ──
          # 배치 근거: m4 부족분 24,061단위을 월별로 실측하니 네 덩어리 —
          #   2018-09~2020-03(9.0k) · 2021-04~08(5.9k) · 2022-07~09(3.1k) · 2023-06~11(6.1k)
          # 기존 레인이 각 덩어리 앞에서 전진 중이므로, 새 레인은 **뒤쪽에서 시작**해 앞뒤로 좁힌다.
          # 이미 받은 (cycle,lead)는 자동 스킵되므로 겹쳐도 중복 수집 없음. seg 태그 분리 → fails 파일 충돌 방지.
          # 첫 16슬롯 안에 들어가야 실제로 도므로 s12a 앞에 배치한다.
          - {member: 4, seg: "s11c",  start: "2019-10-01", end: "2020-08-31", stagger: 42}
          - {member: 4, seg: "s12a2", start: "2021-06-01", end: "2021-12-31", stagger: 44}
          - {member: 4, seg: "s12b2", start: "2022-08-01", end: "2022-12-31", stagger: 46}
          - {member: 4, seg: "s12c2", start: "2023-08-01", end: "2023-12-31", stagger: 48}
          - {member: 4, seg: "s12c3", start: "2023-10-01", end: "2023-12-31", stagger: 50}
          - {member: 0, seg: "s12a", start: "2020-09-01", end: "2021-12-31", stagger: 10}
          - {member: 1, seg: "s12a", start: "2020-09-01", end: "2021-12-31", stagger: 12}
          - {member: 2, seg: "s12a", start: "2020-09-01", end: "2021-12-31", stagger: 14}
          - {member: 3, seg: "s12a", start: "2020-09-01", end: "2021-12-31", stagger: 16}
          - {member: 4, seg: "s12a", start: "2020-09-01", end: "2021-12-31", stagger: 18}
          - {member: 0, seg: "s12b", start: "2022-01-01", end: "2022-12-31", stagger: 20}
          - {member: 1, seg: "s12b", start: "2022-01-01", end: "2022-12-31", stagger: 22}
          - {member: 2, seg: "s12b", start: "2022-01-01", end: "2022-12-31", stagger: 24}
          - {member: 3, seg: "s12b", start: "2022-01-01", end: "2022-12-31", stagger: 26}
          - {member: 4, seg: "s12b", start: "2022-01-01", end: "2022-12-31", stagger: 28}
          - {member: 0, seg: "s12c", start: "2023-01-01", end: "2023-12-31", stagger: 30}
          - {member: 1, seg: "s12c", start: "2023-01-01", end: "2023-12-31", stagger: 32}
          - {member: 2, seg: "s12c", start: "2023-01-01", end: "2023-12-31", stagger: 34}
          - {member: 3, seg: "s12c", start: "2023-01-01", end: "2023-12-31", stagger: 36}
          - {member: 4, seg: "s12c", start: "2023-01-01", end: "2023-12-31", stagger: 38}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install --quiet herbie-data pandas numpy
      - name: Git identity
        run: |
          git config user.name "gefs-collector-bot"
          git config user.email "actions@users.noreply.github.com"
      - name: Collect m${{ matrix.member }}/${{ matrix.seg }}
        run: python worker_v2.py --member ${{ matrix.member }} --seg ${{ matrix.seg }} --start ${{ matrix.start }} --end ${{ matrix.end }} --budget-min 300 --stagger ${{ matrix.stagger }}
      - name: Final flush
        if: always()
        run: |
          git add data/ || true
          git commit -m "v2 m${{ matrix.member }}/${{ matrix.seg }} final flush" || echo "no changes"
          for i in 1 2 3 4 5 6 7 8; do
            git push && break
            git rebase --abort || true
            git pull --rebase --autostash || git status --short
            sleep $((3 + RANDOM % 10))
          done
