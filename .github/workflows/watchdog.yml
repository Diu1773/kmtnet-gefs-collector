name: watchdog
# 자율 복구 — 사람 개입 없이 수집이 계속되도록.
#  ① 정체 런 취소: 진행 중 6h 초과 / 대기 1h 초과
#  ② 실제로 도는 백필이 0이면 즉시 재투입
# [2026-07-26 v3] 취소 반영 지연으로 '가동 중'을 오판해 재투입을 건너뛰는 버그 수정
#   (실측: 17:11 취소 → 20초 뒤 재확인 시 아직 in_progress로 집계 → 재투입 스킵 → 백필 0 공백)
on:
  schedule:
    - cron: "7 * * * *"     # 매시간
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      WF: "GEFS backfill v2"
    steps:
      - name: 정체 런 취소 (진행 6h / 대기 1h)
        run: |
          now=$(date -u +%s); n=0
          : > cancelled_ids.txt
          for pair in "in_progress:21600" "queued:3600"; do
            state="${pair%%:*}"; lim="${pair##*:}"
            gh api "repos/$REPO/actions/runs?status=$state&per_page=50" \
              --jq '.workflow_runs[] | select(.name != "watchdog") | "\(.id) \(.created_at)"' > runs.txt || true
            while read -r id created; do
              [ -z "$id" ] && continue
              age=$(( now - $(date -u -d "$created" +%s) ))
              if [ "$age" -gt "$lim" ]; then
                echo "정체 취소: run $id ($state, 경과 $((age/60))분 > $((lim/60))분)"
                gh api -X POST "repos/$REPO/actions/runs/$id/cancel" >/dev/null 2>&1 || true
                echo "$id" >> cancelled_ids.txt
                n=$((n+1))
              fi
            done < runs.txt
          done
          echo "취소한 정체 런: $n건"
          echo "CANCELLED=$n" >> "$GITHUB_ENV"
      - name: 백필이 멎었으면 재투입
        run: |
          # 취소가 있었으면 반영까지 넉넉히 기다리고, 취소한 런은 활성 집계에서 제외
          if [ "${CANCELLED:-0}" -gt 0 ]; then sleep 90; else sleep 20; fi
          active=0
          for try in 1 2 3; do
            ids=$(gh api "repos/$REPO/actions/runs?per_page=30" \
              --jq "[.workflow_runs[] | select(.name==\"$WF\" and .status==\"in_progress\") | .id] | .[]" || true)
            active=0
            for id in $ids; do
              grep -qx "$id" cancelled_ids.txt 2>/dev/null && continue   # 방금 취소한 건 제외
              active=$((active+1))
            done
            echo "확인 $try: 가동 중 백필 $active"
            [ "$active" -gt 0 ] && break
            sleep 30
          done
          if [ "$active" -eq 0 ]; then
            echo "→ 백필 재투입"
            gh workflow run "$WF" --repo "$REPO"
          else
            echo "→ 정상 가동 중, 조치 없음"
          fi
